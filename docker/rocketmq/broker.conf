brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 微服务全部入容器后：broker 向 NameServer 注册服务名 broker:10911，容器间用服务名互通
brokerIP1 = broker
# NameServer 地址：容器网络内用服务名
namesrvAddr = namesrv:9876
# 自动建 topic（学习环境开启；生产关闭）
autoCreateTopicEnable = true
# 存储路径：容器内路径，配合 named volume 持久化
storePathRootDir = /home/rocketmq/store
