server:
  port: 8082

spring:
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    # Sentinel 控制台地址（不装 Dashboard 也能用 fallback，只是看不到可视化规则）
    # 学习阶段先不装 Dashboard，注释掉也不影响降级功能
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
      # 规则持久化：从 Nacos 拉取流控规则，启动自动加载、发布即更新
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            data-id: ${spring.application.name}-flow-rules.json
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
        # 熔断规则同样持久化到 Nacos，rule-type 换成 degrade
        degrade:
          nacos:
            server-addr: ${NACOS_ADDR:127.0.0.1:8848}
            data-id: ${spring.application.name}-degrade-rules.json
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: degrade
  
  # MySQL配置
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/order_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis 连接配置
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379
  # Spring Cache 配置：底层切换为 Redis
  cache:
    type: redis
    redis:
      # key 前缀，最终 key = 前缀 + 缓存名 + :: + 参数，即 orderCache::users::1
      # 注意：值里含冒号，YAML 必须加引号，否则解析报错
      key-prefix: "orderCache::"
      # 缓存存活时间 60 秒，过期自动删除
      time-to-live: 60s
      # 缓存 null 值，防止缓存穿透（这里降级数据走 unless 拦截，不影响）
      cache-null-values: false

# 开启 Feign 与 Sentinel 整合：Feign 调用失败时自动走 fallbackFactory
feign:
  sentinel:
    enabled: true

# ========== RocketMQ 消息队列 ==========
rocketmq:
  # NameServer 地址（服务发现，Broker 注册到这里）
  name-server: ${NAMESRV_ADDR:127.0.0.1:9876}
  producer:
    # 生产者组名（同一组内消息负载均衡）
    group: order-service-producer-group
    # 发送超时时间（ms）
    send-message-timeout: 3000
    # 失败重试次数（同步发送时生效）
    retry-times-when-send-failed: 2

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # create_time -> createTime 自动驼峰映射

# ========== Seata 分布式事务客户端 ==========
seata:
  application-id: ${spring.application.name}
  # 事务分组：逻辑名称，通过下面的 vgroup-mapping 映射到 TC 集群名
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      # key = 事务分组，value = TC 集群名（与 seata-server 端 registry.nacos.cluster 一致）
      default_tx_group: default
  # 从 Nacos 发现 TC（分组 SEATA_GROUP、服务名 seata-server，与服务端配置对齐）
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      namespace: ""
      group: SEATA_GROUP
      application: seata-server
      cluster: default
  # AT 模式自动代理数据源（拦截 SQL、生成 undo_log 快照），默认即为 true，显式写出便于学习
  enable-auto-data-source-proxy: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  # 链路追踪：100% 采样，上报到 Zipkin
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:127.0.0.1}:9411/api/v2/spans
