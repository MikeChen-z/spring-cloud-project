# order-service 迁移清单（结构与 user-service 一致，差异：端口 8082、内存上限 700Mi 对齐 compose mem_limit: 700m）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: study
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: order-service
          image: order-service:1.0.0
          imagePullPolicy: IfNotPresent   # 本地镜像，禁 Always（见 user-service.yaml 注释）
          ports:
            - containerPort: 8082
          env:
            - name: NACOS_ADDR
              value: host.docker.internal:8848
            - name: MYSQL_HOST
              value: host.docker.internal
            - name: REDIS_HOST
              value: host.docker.internal
            - name: NAMESRV_ADDR
              value: host.docker.internal:9876
            - name: ZIPKIN_HOST
              value: host.docker.internal
            - name: SENTINEL_DASHBOARD
              value: host.docker.internal:8858
            - name: SPRING_CLOUD_SENTINEL_EAGER
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 700Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: study
spec:
  selector:
    app: order-service
  ports:
    - port: 8082
      targetPort: 8082