# gateway-service 迁移清单（与 user/order 的差异：对外入口用 LoadBalancer，不连 MySQL/MQ 所以 env 更少）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: study
  labels:
    app: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /actuator/prometheus
    spec:
      containers:
        - name: gateway-service
          image: gateway-service:1.0.0
          imagePullPolicy: IfNotPresent   # 本地镜像，禁 Always（见 user-service.yaml 注释）
          ports:
            - containerPort: 9000
          env:
            - name: NACOS_ADDR
              value: host.docker.internal:8848
            - name: REDIS_HOST
              value: host.docker.internal
            - name: ZIPKIN_HOST
              value: host.docker.internal
            - name: SENTINEL_DASHBOARD
              value: host.docker.internal:8858
            - name: SPRING_CLOUD_SENTINEL_EAGER
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
---
# type: LoadBalancer 是 Docker Desktop K8s 的便利特性：无需装 LB/Ingress 控制器，
# 直接把 port 绑定到宿主机 localhost——9000 端口与 compose 时代完全一致，
# scripts/ 下全部脚本（verify-full-chain / fault-drill / lag-pusher 等）零改动继续可用。
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: study
spec:
  type: LoadBalancer
  selector:
    app: gateway-service
  ports:
    - port: 9000
      targetPort: 9000