# Prometheus 的 K8s 服务发现需要调 API Server 列举/监听 Pod 等资源的权限（RBAC 三件套）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: study
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-study
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-study
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-study
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: study