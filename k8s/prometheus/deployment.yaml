# Prometheus Deployment + LoadBalancer Service（配置由 prometheus-config ConfigMap 挂载，
# 创建命令：kubectl create configmap prometheus-config -n study \
#   --from-file=k8s/prometheus/prometheus.yml --from-file=k8s/prometheus/alerts.yml）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: study
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus   # 绑定 RBAC，否则 K8s SD 调 API Server 返回 403
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1   # 与 compose 同版本，本地已有镜像
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
# LoadBalancer 绑宿主机 9090，与 compose 时代一致：
# fault-drill.ps1 轮询 localhost:9090/api/v1/alerts 零改动；Grafana 数据源指 host.docker.internal:9090
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: study
spec:
  type: LoadBalancer
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090