server:
  port: 8081

spring:
  application:
    # 注册到 Nacos 的服务名，后续 Feign、Gateway 都用这个名字找到它
    name: user-service
  cloud:
    nacos:
      # 服务注册与发现
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      # 配置中心
      config:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        file-extension: yaml
    # Sentinel 控制台地址：Dashboard 可可视化 user-service 的接口级实时监控，
    # 动态下发流控/熔断规则（无需重启服务）
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
  # 数据源：把密码改成你本机 MySQL 的密码
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/study_cloud?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379

  # Spring Cloud 2023 标准方式：通过 config.import 拉取 Nacos 配置（无需再用 bootstrap.yml）
  # optional: 前缀表示 Nacos 中还没有该配置时不阻断启动
  config:
    import:
      - optional:nacos:user-service.yaml

# ========== RocketMQ 消息队列 ==========
rocketmq:
  # NameServer 地址
  name-server: ${NAMESRV_ADDR:127.0.0.1:9876}

# JWT 配置（学习用固定密钥；生产环境应通过环境变量/Nacos 加密配置注入，并定期轮换）
# 注意：HS256 要求密钥至少 32 字节（字节数，不是字符数）
jwt:
  secret: study-cloud-jwt-secret-key-2026-09-29-change-me-please-32bytes
  # token 有效期 1 小时（单位毫秒）
  access-expiration: 1800000   # Access Token 30 分钟
  refresh-expiration: 604800000 # Refresh Token 7 天

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # t_user_name -> userName 自动驼峰映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 学习阶段打印 SQL 到控制台

# ========== Seata 分布式事务客户端 ==========
seata:
  application-id: ${spring.application.name}
  # 事务分组：逻辑名称，通过下面的 vgroup-mapping 映射到 TC 集群名
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      # key = 事务分组，value = TC 集群名（与 seata-server 端 registry.nacos.cluster 一致）
      default_tx_group: default
  # 从 Nacos 发现 TC（分组 SEATA_GROUP、服务名 seata-server，与服务端配置对齐）
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      namespace: ""
      group: SEATA_GROUP
      application: seata-server
      cluster: default
  # AT 模式自动代理数据源（拦截 SQL、生成 undo_log 快照），默认即为 true，显式写出便于学习
  enable-auto-data-source-proxy: true

# 学习阶段暴露所有 actuator 端点（生产环境不要这么配）
management:
  # 给所有 Micrometer 指标统一打 application 标签，Grafana 可按服务筛选聚合
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: '*'
  # 链路追踪：1.0 = 100% 采样（生产环境通常 0.1 即 10%）
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://${ZIPKIN_HOST:127.0.0.1}:9411/api/v2/spans
